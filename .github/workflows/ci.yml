name: Folio checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    # The full desktop/mobile suite can take 17+ minutes on hosted runners;
    # leave time for OpenNext and the Worker build/runtime checks that follow.
    timeout-minutes: 30
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run setup
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:d1
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:gui
      - run: bun run cf:build
      - run: bun run backend:build
      - run: bun run backend:smoke
      - run: bun run frontend:build
      - run: bun run frontend:smoke
      - run: bun run scheduler:build
